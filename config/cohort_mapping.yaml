# Mapping config for the cohort Analysis-Ready File (Milestone 1 spec, SC-1). Run on every load.
# Types are not here: they come from config/destination_schema.yaml (spec D8).
# Allowed values come from data/dictionaries/arf_cohort_data_dictionary.md in the starter repo and are
# compared ignoring case and spaces. on_conflict is what the loader does when the destination row
# already holds a value: append, replace or keep (spec D6, D7).

- source: Cohort
  destination_table: cohort_membership
  destination_column: cohort
  validation_rule: "Required; pattern YYYY-YY, two consecutive years"
  on_conflict: replace

- source: Student_GUID
  destination_table: student
  destination_column: student_id
  validation_rule: "Required; 32 hexadecimal characters"
  on_conflict: replace

- source: Student_GUID
  destination_table: cohort_membership
  destination_column: student_id
  validation_rule: "Required; 32 hexadecimal characters"
  on_conflict: replace

- source: Cohort_Term
  destination_table: cohort_membership
  destination_column: cohort_term
  validation_rule: "Required; AllowedValues [Fall, Winter, Spring, Summer]"
  on_conflict: replace

- source: Student_Age
  destination_table: student
  destination_column: student_age
  validation_rule: "AllowedValues [20 and younger, > 20-24, Older than 24]"
  on_conflict: replace   # latest cohort row wins for the 2 students with two cohort rows (D6)

- source: Enrollment_Type
  destination_table: cohort_membership
  destination_column: enrollment_type
  validation_rule: "AllowedValues [First-time, Re-admit, Transfer-in]"
  on_conflict: replace

- source: Enrollment_Intensity_First_Term
  destination_table: cohort_membership
  destination_column: enrollment_intensity_first_term
  validation_rule: "AllowedValues [Full-time, Part-time]"
  on_conflict: replace

- source: Math_Placement
  destination_table: cohort_membership
  destination_column: math_placement
  validation_rule: "AllowedValues [C, N, UK]"
  on_conflict: replace

- source: English_Placement
  destination_table: cohort_membership
  destination_column: english_placement
  validation_rule: "AllowedValues [C, N, UK]"
  on_conflict: replace

- source: Dual_and_Summer_Enrollment
  destination_table: cohort_membership
  destination_column: dual_and_summer_enrollment
  validation_rule: "AllowedValues [DE, SE, DS]"
  on_conflict: replace

- source: Race
  destination_table: student
  destination_column: race
  validation_rule: "AllowedValues [White, Hispanic, American Indian or Alaska Native, Native Hawaiian or Other Pacific Islander, Two or More Races, Black or African American, Nonresident alien, Asian, Unknown]"
  on_conflict: replace   # latest cohort row wins for the 2 students with two cohort rows (D6)

- source: Ethnicity
  destination_table: student
  destination_column: ethnicity
  validation_rule: "AllowedValues [UK, H, N]"
  on_conflict: replace   # latest cohort row wins for the 2 students with two cohort rows (D6)

- source: Gender
  destination_table: student
  destination_column: gender
  validation_rule: "AllowedValues [M, F, P, X, UK]"
  on_conflict: replace   # latest cohort row wins for the 2 students with two cohort rows (D6)

- source: First_Gen
  destination_table: student
  destination_column: first_gen
  validation_rule: "AllowedValues [N, P, C, A, B, E]; blank allowed"
  on_conflict: replace   # latest cohort row wins for the 2 students with two cohort rows (D6)

