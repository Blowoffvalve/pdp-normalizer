# Destination type constants for the normalized data model (Milestone 1 spec, SC-2 and D8).
# The only place column types are defined. One parent map per table; fields in column order.
# type: Python type the mapper converts to (str, int, float, bool, date, datetime).
# nullable: whether the value can be blank. primary_key / foreign_key / unique (fields sharing a
# group name are unique together) where they apply.

institution:
  institution_id: {type: int, nullable: false, primary_key: true}
  name: {type: str, nullable: false}
  is_placeholder: {type: bool, nullable: false}

data_provider:
  provider_id: {type: int, nullable: false, primary_key: true}
  name: {type: str, nullable: false}
  source_file: {type: str, nullable: false}
  file_sha256: {type: str, nullable: false, unique: loaded_file}   # re-loading the same file finds the same row
  row_count: {type: int, nullable: false}
  loaded_at: {type: datetime, nullable: false}

student:
  student_id: {type: str, nullable: false, primary_key: true}
  institution_id: {type: int, nullable: false, foreign_key: institution.institution_id}
  student_age: {type: str, nullable: true}
  race: {type: str, nullable: true}
  ethnicity: {type: str, nullable: true}
  gender: {type: str, nullable: true}
  first_gen: {type: str, nullable: true}

cohort_membership:
