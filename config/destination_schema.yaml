# Destination schema for the normalized data model: what a valid STORED value looks like,
# whichever file it came from (Milestone 2.1 spec, D2). How a particular file writes its values
# (date formats, codes for "no value" and "unknown", repairs) goes in that file's mapping config.
#
# One parent map per table; fields in column order. Each field has:
#   type            Python type: str, int, float, bool, date, datetime. The only place types are defined.
#   nullable        whether the stored value can be blank.
#   primary_key / foreign_key / unique   keys; fields sharing a unique group name are unique together.
# and may have:
#   default_value   stored when the source gives no value (D5).
#   unknown_value   stored when the source says it doesn't know (D6). Text columns use UNKNOWN;
#                   number, date and true/false columns have none, so unknown is stored blank.
#   list_delimiter  the stored value is a list joined by this character; rules check each item.
#   rules           checks on real values (not blank, default or unknown). One kind per rule, plus
#                   severity: error (the row is held back) or warning (reported, still loaded).
#                   Kinds: enum, value_set (a list in config/value_sets.yaml), pattern, minimum,
#                   maximum, max_length, not_before, not_greater_than, required_when, academic_year.
#                   enum and value_set take ignore_case and ignore_spaces; any rule takes `when`.
#                   Names follow Frictionless Table Schema where it has one (D4). See the README.

institution:
  institution_id: {type: int, nullable: false, primary_key: true}
  name: {type: str, nullable: false}
  is_placeholder: {type: bool, nullable: false}

data_provider:
  provider_id: {type: int, nullable: false, primary_key: true}
  name: {type: str, nullable: false}
  source_file: {type: str, nullable: false}
  file_sha256: {type: str, nullable: false, unique: loaded_file}   # re-loading the same file finds the same row
  row_count: {type: int, nullable: false}
  loaded_at: {type: datetime, nullable: false}

student:
  student_id:
    type: str
    nullable: false
    primary_key: true
    rules:
      - {pattern: '^[0-9A-Fa-f]{32}$', severity: error}
  institution_id: {type: int, nullable: false, foreign_key: institution.institution_id}
  student_age:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [20 and younger, '> 20-24', Older than 24], ignore_case: true, ignore_spaces: true, severity: error}
  race:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [Nonresident Alien, American Indian or Alaska Native, Asian, Black or African American, Native Hawaiian or Other Pacific Islander, White, Hispanic, Two or More Races], ignore_case: true, severity: error}
  ethnicity:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [H, N], severity: error}
  gender:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [M, F, P, X], severity: error}
  first_gen:
    type: str
    nullable: true
    rules:
      - {enum: [N, P, C, A, B, E], severity: error}

cohort_membership:
  student_id: {type: str, nullable: false, primary_key: true, foreign_key: student.student_id}
  cohort:
    type: str
    nullable: false
    primary_key: true
    rules:
      - {academic_year: true, severity: error}
  provider_id: {type: int, nullable: false, foreign_key: data_provider.provider_id}
  cohort_term:
    type: str
    nullable: false
    rules:
      - {value_set: academic_term, ignore_case: true, severity: error}
  enrollment_type:
    type: str
    nullable: true
    rules:
      - {enum: [First-time, Re-admit, Transfer-in], ignore_case: true, severity: error}
  enrollment_intensity_first_term:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [Full-time, Part-time], ignore_case: true, severity: error}
  math_placement:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: placement, severity: error}
  english_placement:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: placement, severity: error}
  dual_and_summer_enrollment:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [DE, SE, DS], severity: error}
  pell_status_first_year:
    type: str
    nullable: true
    rules:
      - {value_set: yes_no, severity: error}
  attendance_status_term_1:
    type: str
    nullable: true
    rules:
      - {enum: [First-Time Full-Time, First-Time Part-Time, Transfer-In Full-Time, Transfer-In Part-Time], ignore_case: true, severity: error}
  credential_type_sought_year_1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [C1, C2, C4, '01', A, '02', B, '03', PB, '04', M, '05', D, '06', FP, '07', PC, '08', NC, '99'], severity: error}
  program_of_study_term_1:
    type: str
    nullable: true
    rules:
      - {pattern: '^[0-9]{6}$', severity: error}
  gpa_group_term_1:
    type: float
    nullable: true
    rules:
      - {minimum: 0, maximum: 4, severity: error}
  gpa_group_year_1:
    type: float
    nullable: true
    rules:
      - {minimum: 0, maximum: 4, severity: error}
  number_of_credits_attempted_yr_1:
    type: float
    nullable: true
    rules:
      - {minimum: 1, severity: error}
  number_of_credits_earned_yr_1:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_attempted_yr_2:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_2:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_attempted_yr_3:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_3:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_attempted_yr_4:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  number_of_credits_earned_yr_4:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
  gateway_math_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: gateway_status, severity: error}
  gateway_english_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: gateway_status, severity: error}
  attempted_gateway_math_year1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: yes_no, severity: error}
  attempted_gateway_english_year1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: yes_no, severity: error}
  completed_gateway_math_year1:
    type: str
    nullable: true
    rules:
      - {value_set: completed_c_d_na, severity: error}
  completed_gateway_english_year1:
    type: str
    nullable: true
    rules:
      - {value_set: completed_c_d_na, severity: error}
  gateway_math_grade_y1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {pattern: '^(4(\.0+)?|[0-3](\.[0-9]+)?|P|F|I|W|A|O)$', severity: error}
  gateway_english_grade_y1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {pattern: '^(4(\.0+)?|[0-3](\.[0-9]+)?|P|F|I|W|A|O)$', severity: error}
  attempted_dev_math_y1:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
