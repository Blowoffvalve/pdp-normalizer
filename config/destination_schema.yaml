    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  program_of_study_year_1:
    type: str
    nullable: true
    rules:
      - {pattern: '^[0-9]{6}$', severity: error}
  s_most_recent_bachelors_at_o_i:
