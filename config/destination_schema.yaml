      - {pattern: '^[A-Z]{2}$', severity: error}
  s_most_recent_last_enroll_at_o:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Z]{2}$', severity: error}
  s_first_bachelors_at_other_ins:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Z]{2}$', severity: error}
  s_first_associates_or_cert:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Z]{2}$', severity: error}
  c_most_recent_bachelors_at_o_i:
