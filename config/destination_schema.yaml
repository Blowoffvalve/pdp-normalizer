term:
  term_id: {type: int, nullable: false, primary_key: true}
  academic_year: {type: str, nullable: false, unique: term_key}
  academic_term: {type: str, nullable: false, unique: term_key}
  sort_order: {type: int, nullable: false}

course:
  course_id: {type: int, nullable: false, primary_key: true}
  course_prefix: {type: str, nullable: false, unique: course_code}
  course_number: {type: str, nullable: false, unique: course_code}

course_enrollment:
  enrollment_id: {type: int, nullable: false, primary_key: true}
  provider_id: {type: int, nullable: false, foreign_key: data_provider.provider_id, unique: source_row}
  source_row_number: {type: int, nullable: false, unique: source_row}
  student_id: {type: str, nullable: false, foreign_key: student.student_id}
  course_id: {type: int, nullable: true, foreign_key: course.course_id}
  term_id: {type: int, nullable: false, foreign_key: term.term_id}
  attempt_number: {type: int, nullable: true}   # blank on rows with no course record
  section_id: {type: str, nullable: true}
  course_name: {type: str, nullable: true}
  course_cip: {type: str, nullable: true}
  course_type: {type: str, nullable: true}
  math_or_english_gateway: {type: str, nullable: true}
  co_requisite_course: {type: str, nullable: true}
  course_begin_date: {type: date, nullable: true}
  course_end_date: {type: date, nullable: true}
  grade: {type: str, nullable: true}
  number_of_credits_attempted: {type: float, nullable: true}
  number_of_credits_earned: {type: float, nullable: true}
  delivery_method: {type: str, nullable: true}
  core_course: {type: str, nullable: true}
  core_course_type: {type: str, nullable: true}
  core_competency_completed: {type: str, nullable: true}
  enrolled_at_other_institution_s: {type: str, nullable: true}
  credential_engine_identifier: {type: str, nullable: true}
  course_instructor_employment_sta: {type: str, nullable: true}
  course_instructor_rank: {type: str, nullable: true}
  s_enrollment_record_at_other: {type: str, nullable: true}
  c_enrollment_record_at_other: {type: str, nullable: true}
  l_enrollment_record_at_other: {type: str, nullable: true}
  term_program_of_study: {type: str, nullable: true}

student_attribute:
  attribute_id: {type: int, nullable: false, primary_key: true}
  student_id: {type: str, nullable: false, foreign_key: student.student_id, unique: attribute_fact}
  term_id: {type: int, nullable: true, foreign_key: term.term_id, unique: attribute_fact}
  attribute_key: {type: str, nullable: false, unique: attribute_fact}
  attribute_value: {type: str, nullable: false, unique: attribute_fact}
  source: {type: str, nullable: false, unique: attribute_fact}

institution_event:
  event_id: {type: int, nullable: false, primary_key: true}
  institution_id: {type: int, nullable: false, foreign_key: institution.institution_id, unique: event_fact}
  event_type: {type: str, nullable: false, unique: event_fact}
  name: {type: str, nullable: false, unique: event_fact}
  start_date: {type: date, nullable: false, unique: event_fact}
  end_date: {type: date, nullable: false}
  source: {type: str, nullable: true}
