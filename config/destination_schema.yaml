  completed_dev_math_y1:
    type: str
    nullable: true
    rules:
      - {value_set: completed_c_d_na, severity: error}
  completed_dev_english_y1:
    type: str
    nullable: true
    rules:
      - {value_set: completed_c_d_na, severity: error}
  retention: {type: bool, nullable: true}
  persistence: {type: bool, nullable: true}
  years_to_ba_at_cohort_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_to_a_or_c_at_cohort_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_to_ba_at_other_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_to_a_or_c_at_other_inst:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_of_last_enrollment_at_coho:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  years_of_last_enrollment_at_othe:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  time_to_credential:
    type: float
    nullable: true
    rules:
      - {minimum: 0, severity: error}
      - {pattern: '^[0-9]+(\.[0-9])?$', severity: error}
  reading_placement:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: placement, severity: error}
  special_program: {type: str, nullable: true}
  naspa_first_generation:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: ['0', '1', '2', '3', '4', '5', '6'], severity: error}
  incarcerated_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: [Y, P, N], severity: error}
  military_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: ['0', '1', '2'], severity: error}
  employment_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {enum: ['1', '2', '3', '4'], severity: error}
  disability_status:
    type: str
    nullable: true
    unknown_value: UNKNOWN
    rules:
      - {value_set: yes_no, severity: error}
  foreign_language_completion:
    type: str
    nullable: true
    rules:
      - {pattern: '^((FALL|WINTER|SPRING|SUMMER) [0-9]{4}|N)$', severity: error}
  first_year_to_bachelors_at_coh:
    type: int
    nullable: true
    rules:
      - {value_set: count_0_to_7, severity: error}
  first_year_to_a_or_c_at_cohort:
    type: int
    nullable: true
    rules:
