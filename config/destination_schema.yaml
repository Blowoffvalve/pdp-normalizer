  c_most_recent_last_enroll_at_o:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Za-z][A-Za-z'' &/-]*$', severity: error}
  c_first_bachelors_at_other_ins:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Za-z][A-Za-z'' &/-]*$', severity: error}
  c_first_associates_or_cert:
    type: str
    nullable: true
    rules:
      - {pattern: '^[A-Za-z][A-Za-z'' &/-]*$', severity: error}
  l_most_recent_bachelors_at_o_i:
    type: str
    nullable: true
    rules:
      - {value_set: locale, severity: error}
  l_most_recent_associates_or_c:
    type: str
    nullable: true
    rules:
      - {value_set: locale, severity: error}
  l_most_recent_last_enroll_at_o:
    type: str
    nullable: true
    rules:
      - {value_set: locale, severity: error}
  l_first_bachelors_at_other_ins:
    type: str
    nullable: true
    rules:
      - {value_set: locale, severity: error}
  l_first_associates_or_cert:
    type: str
    nullable: true
