  attempted_gateway_math_year1: {type: str, nullable: true}
  attempted_gateway_english_year1: {type: str, nullable: true}
  completed_gateway_math_year1: {type: str, nullable: true}
  completed_gateway_english_year1: {type: str, nullable: true}
  gateway_math_grade_y1: {type: str, nullable: true}
