# Mapping config for the institution events enrichment file (Milestone 1 spec, P5).
# Types come from config/destination_schema.yaml. An entry with `value:` instead of `source:` writes the
# same fixed value on every row (spec P4). The mock data has one placeholder institution, id 1.

- value: 1
  destination_table: institution_event
  destination_column: institution_id
  validation_rule: Required; must exist in institution.institution_id
  on_conflict: replace

- source: Event_Type
  destination_table: institution_event
  destination_column: event_type
  validation_rule: Required; AllowedValues [closure, ceremony, powwow]
  on_conflict: replace

- source: Event_Name
  destination_table: institution_event
  destination_column: name
  validation_rule: Required
  on_conflict: replace

- source: Start_Date
  destination_table: institution_event
  destination_column: start_date
  validation_rule: Required; format YYYYMMDD
  on_conflict: replace

- source: End_Date
  destination_table: institution_event
  destination_column: end_date
  validation_rule: Required; format YYYYMMDD; on or after start_date
  on_conflict: replace

- source: Source
  destination_table: institution_event
  destination_column: source
  validation_rule: Required
  on_conflict: replace
