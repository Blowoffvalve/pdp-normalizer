# Where each column of the course Analysis-Ready File goes (Milestone 1 spec, SC-1). Run on every load.
# Types are not here: they come from config/destination_schema.yaml (Milestone 1 D8).
#
# Each entry: source, destination_table, destination_column and on_conflict (append, replace or
# keep: what the loader does when the destination row already holds a value).
# A source column with no destination is marked `dropped:` with the reason.
# 17,755 rows have no course record (the student was enrolled elsewhere that term, or the term is
# unknown): course fields are blank on those rows, and course_enrollment.course_id is blank (M1 P9).

- source: Student_GUID
  destination_table: course_enrollment
  destination_column: student_id
  on_conflict: replace

- source: Student_GUID
  destination_table: student
  destination_column: student_id
  on_conflict: keep         # finds the student row the cohort file wrote

- source: Student_GUID
  destination_table: cohort_membership
  destination_column: student_id
  on_conflict: keep         # with Cohort, finds the cohort row the cohort file wrote

- source: Student_Age
  destination_table: student
  destination_column: student_age
  on_conflict: keep         # always equals the cohort file's value today

- source: Race
  destination_table: student
  destination_column: race
  on_conflict: keep

- source: Ethnicity
  destination_table: student
  destination_column: ethnicity
  on_conflict: keep

- source: Gender
  destination_table: student
  destination_column: gender
  on_conflict: keep

- source: Cohort
  destination_table: cohort_membership
  destination_column: cohort
  on_conflict: keep

- source: Cohort_Term
  destination_table: cohort_membership
  destination_column: cohort_term
  on_conflict: append       # D1; Q-C, open question for Dena (/dev/color): the dictionary defines it as "term student first enrolled in at least one course"

